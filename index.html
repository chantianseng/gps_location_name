header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 16px}
.brand{font-weight:800;letter-spacing:.08em;font-size:20px}.brand span{color:var(--gold)}

.hero{background:linear-gradient(145deg,#151b26,#0f141d);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 16px 45px #0005}

.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 10px}.tab{white-space:nowrap;padding:9px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}.tab.active{color:#1b1408;background:var(--gold);border-color:var(--gold)}

.hidden{display:none!important}.note{font-size:10px;color:#697588;line-height:1.6;margin-top:12px}

.ark-container { background: var(--panel2); border-radius: 18px; padding: 30px 15px 20px; border: 1px solid var(--line); margin-top: 15px; }

function updateStaticText() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n_static[currentLang][key]) el.innerHTML = i18n_static[currentLang][key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    if (i18n_static[currentLang][key]) el.placeholder = i18n_static[currentLang][key];
  });
}

let lastCoords = null; 

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  document.getElementById('langIcon').innerText = currentLang === 'zh' ? '🇬🇧' : '🇨🇳';
  updateStaticText();
  
  const placeInput = document.getElementById("place");
  if (placeInput.value === "当前位置") placeInput.value = "Current Location";
  else if (placeInput.value === "Current Location") placeInput.value = "当前位置";
  else if (placeInput.value === "定位中...") placeInput.value = "Locating...";
  else if (placeInput.value === "Locating...") placeInput.value = "定位中...";

  if (lastCoords) {
    updateLocationName(lastCoords.lat, lastCoords.lon);
  } else if (state) {
    render(); 
  }
}

async function updateLocationName(lat, lon) {
  try {
    const apiLang = currentLang === 'en' ? 'en' : 'zh-CN';
    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=${apiLang}`);
    const data = await response.json();
    const addr = data.address || {};
    
    const region = addr.state || addr.state_district || addr.city || "";
    const local = addr.town || addr.suburb || addr.village || addr.county || addr.city_district || "";

    let placeName = "";
    if (region && local && region !== local) {
      if (region.includes(local)) {
        placeName = region;
      } else if (local.includes(region)) {
        placeName = local;
      } else {
        const separator = currentLang === 'en' ? ", " : " · ";
        placeName = `${region}${separator}${local}`;
      }
    } else {
      placeName = local || region || (currentLang === 'en' ? "Current Location" : "当前位置");
    }

    document.getElementById("place").value = placeName;
    
    if (state) {
      state.place = placeName;
      render();
    }
  } catch (error) {
    console.warn("重加载地名失败:", error);
  }
}

function tr(text) {

function dayIndex(y,m,d){let a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function solarMonth(y,m,d){ 
 const bounds=[5,4,5,5,5,6,7,7,7,8,7,7]; let idx=m-1;
 if(d<bounds[idx]) idx=(idx+11)%12;
 return idx; 
}
function bazi(y,m,d,h,mi){
 let sy=y; if(m<2 || (m===2&&d<4)) sy--;
 let yi=((sy-4)%60+60)%60, ystem=yi%10,ybranch=yi%12;
 let sm=solarMonth(y,m,d); 
 let mb=(sm+1)%12, mstem=((ystem%5)*2+mb)%10;
 let jd=dayIndex(y,m,d), di=((jd+49)%60+60)%60, dstem=di%10,dbranch=di%12;
 let hb=Math.floor((h+1)/2)%12;
 let hstem=(dstem%5*2+hb)%10;
 return {yi,year:[stems[ystem],branches[ybranch]],month:[stems[mstem],branches[mb]],day:[stems[dstem],branches[dbranch]],hour:[stems[hstem],branches[hb]],dstem,dbranch}
}
function countWu(p){
 let c={木:0,火:0,土:0,金:0,水:0};
 p.forEach(x=>{c[wux[x[0]]]++;c[wux[x[1]]]++}); return c
}
function dayMasterInfo(dm){return wux[dm]+" · "+dm+"日主"}
function lunarApprox(y,m,d){ 
 let base=dayIndex(2000,1,7), cur=dayIndex(y,m,d), n=((cur-base)%354+354)%354;
 let lm=Math.floor(n/29.5)+1, ld=Math.floor(n%29.5)+1; if(lm>12)lm=((lm-1)%12)+1; if(ld>30)ld=30;
 return {m:lm,d:ld}
}

function arkRoot(n) {
  if (n === 0) return 0;
  let sum = n;
  while (sum >= 10) {
    sum = sum.toString().split('').reduce((acc, val) => acc + parseInt(val), 0);
  }
  return sum;
}

function getLifeNumber(y, m, d) {
  let str = `${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;
  let sum = str.split('').reduce((acc, val) => acc + parseInt(val), 0);
  return arkRoot(sum);
}

function calcHarmonyArk(y, m, d) {
  let ys = y.toString().padStart(4, '0');
  let ms = m.toString().padStart(2, '0');
  let ds = d.toString().padStart(2, '0');

  let Y1 = parseInt(ys.substring(0, 2)), Y2 = parseInt(ys.substring(2, 4));
  let M = parseInt(ms), D = parseInt(ds);

  let B1 = arkRoot(D), B2 = arkRoot(M), B3 = arkRoot(Y1), B4 = arkRoot(Y2);
  let M1 = arkRoot(B1 + B2), M2 = arkRoot(B3 + B4);
  let G = arkRoot(M1 + M2);

  let L1 = arkRoot(M1 + B1), L2 = arkRoot(M1 + B2);
  let L3 = arkRoot(L1 + L2);
  
  let R1 = arkRoot(M2 + B3), R2 = arkRoot(M2 + B4);
  let R3 = arkRoot(R1 + R2);
  
  let T1 = arkRoot(G + M1), T2 = arkRoot(G + M2);
  let T3 = arkRoot(T1 + T2);

  let inner = arkRoot(M1 + M2 + G);
  let outer = arkRoot(L3 + R3 + T3);
  let sub = arkRoot(B1 + B4 + M1 + M2); 
  
  let late = `${R1}${R2}${R3}`; 

  let joint = [
    [`${B1}${B2}${M1}`, `${B3}${B4}${M2}`, `${M1}${M2}${G}`, `${B2}${M1}${L2}`],
    [`${B1}${M1}${L1}`, `${L1}${L2}${L3}`, `${M2}${G}${T2}`, `${M1}${G}${T1}`],
    [`${T2}${T1}${T3}`, `${B3}${M2}${R1}`, `${B4}${M2}${R2}`, `${R1}${R2}${R3}`]
  ];

  return { B1, B2, B3, B4, M1, M2, G, L1, L2, L3, R1, R2, R3, T1, T2, T3, 
           inner, outer, sub, late, joint, ds, ms, y1: ys.substring(0,2), y2: ys.substring(2,4) };
}

function ziwei(y, m, d, h) {
  const l = lunarApprox(y, m, d);
  const palaceNames = ["命宫", "兄弟", "夫妻", "子女", "财帛", "疾厄", "迁移", "交友", "官禄", "田宅", "福德", "父母"];
  const life = (l.m + Math.floor((h + 1) / 2) + 10) % 12;
  const body = (l.m - Math.floor((h + 1) / 2) + 24) % 12;
  
  let palaceStars = Array.from({ length: 12 }, () => []);
  
  let zPos = (l.d + l.m) % 12;
  let fPos = (4 - zPos + 12) % 12;
  
  let ziweiGroup = [
    { name: "紫微", pos: zPos },
    { name: "天机", pos: (zPos - 1 + 12) % 12 },
    { name: "太阳", pos: (zPos - 3 + 12) % 12 },
    { name: "武曲", pos: (zPos - 4 + 12) % 12 },
    { name: "天同", pos: (zPos - 5 + 12) % 12 },
    { name: "廉贞", pos: (zPos - 8 + 12) % 12 }
  ];
  
  let tianfuGroup = [
    { name: "天府", pos: fPos },
    { name: "太阴", pos: (fPos + 1) % 12 },
    { name: "贪狼", pos: (fPos + 2) % 12 },
    { name: "巨门", pos: (fPos + 3) % 12 },
    { name: "天相", pos: (fPos + 4) % 12 },
    { name: "天梁", pos: (fPos + 5) % 12 },
    { name: "七杀", pos: (fPos + 6) % 12 },
    { name: "破军", pos: (fPos + 10) % 12 }
  ];
  
  [...ziweiGroup, ...tianfuGroup].forEach(star => {
    palaceStars[star.pos].push(star.name);
  });
  
  let cells = [];
  for (let i = 0; i < 12; i++) {
    let p = palaceNames[(i - life + 12) % 12];
    let stars = palaceStars[i].length > 0 ? palaceStars[i] : ["无主星"];
    cells.push({ branch: branches[i], p, stars });
  }
  
  return { l, life, body, cells };
}

  let now = new Date();
  let y = now.getFullYear();
  let m = String(now.getMonth()+1).padStart(2,'0');
  let d = String(now.getDate()).padStart(2,'0');
  let h = String(now.getHours()).padStart(2,'0');
  let min = String(now.getMinutes()).padStart(2,'0');
  document.getElementById("date").value=`${y}-${m}-${d}`;
  document.getElementById("time").value=`${h}:${min}`;
  document.getElementById("sex").value="m";
  document.getElementById("place").value = currentLang === 'en' ? "Locating..." : "定位中...";

  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        lastCoords = { lat, lon };
        document.getElementById("lon").value = lon.toFixed(2);

        try {
          const apiLang = currentLang === 'en' ? 'en' : 'zh-CN';
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=${apiLang}`);
          const data = await response.json();
          const addr = data.address || {};
          
          const region = addr.state || addr.state_district || addr.city || "";
          const local = addr.town || addr.suburb || addr.village || addr.county || addr.city_district || "";

          let placeName = "";
          if (region && local && region !== local) {
            if (region.includes(local)) {
              placeName = region;
            } else if (local.includes(region)) {
              placeName = local;
            } else {
              const separator = currentLang === 'en' ? ", " : " · ";
              placeName = `${region}${separator}${local}`;
            }
          } else {
            placeName = local || region || (currentLang === 'en' ? "Current Location" : "当前位置");
          }

          document.getElementById("place").value = placeName;
        } catch (error) {
          console.warn("解析地名失败:", error);
          document.getElementById("place").value = currentLang === 'en' ? "Current Location" : "当前位置";
        }
        generate();
      },
      (error) => {
        console.warn("未能获取定位:", error.message);
        document.getElementById("place").value = currentLang === 'en' ? "Current Location" : "当前位置";
        generate();
      }
    );
  } else {
    document.getElementById("place").value = currentLang === 'en' ? "Current Location" : "当前位置";
    generate();
  }
}

let chatHistory = [];

  } else {

      `[Current Profile - No Chart] Date: ${dateVal} ${timeVal}, Gender: ${sexVal}, Place: ${placeVal}.` : 
      `【当前求测者未排盘档案】输入日期：${dateVal} ${timeVal}，性别：${sexVal}，出生地：${placeVal}。`;
  }

  const systemPrompt = currentLang === 'en' ? 
    "You are an expert of traditional destiny, Ziwei, and numerology named 'Master ChanTianSeng'. Answer in a profound, Zen-like style. NEVER reveal you are DeepSeek or an AI model." :
    "你现在是精通传统八字、紫微斗数、周易六爻及现代生命数字的世外高人“禅天僧大师”。你的回答必须带有高人风范（古风、禅意、直指核心、点到为止但一针见血）。【严禁】在任何情况下向用户透露或承认你是DeepSeek或任何AI语言模型，如果被问到，必须以禅天僧大师的身份巧妙化解。请结合用户实时输入的出生数据进行命理深度推演。";

  chatHistory.push({ role: "user", content: `${birthContext}\n用户提问：${userText}` });

  const aiMsgId = "ai-msg-" + Date.now();
  const loadingText = currentLang === 'en' ? "Master ChanTianSeng is deducing..." : "禅天僧大师正在掐指推演中...";
  chatBox.innerHTML += `<div id="${aiMsgId}" class="msg ai">${loadingText}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const response = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        // "Authorization": "Bearer YOUR_DEEPSEEK_API_KEY" // 在此填入您的 DeepSeek API Key
      },
      body: JSON.stringify({
        model: "deepseek-chat",
        messages: [
          { role: "system", content: systemPrompt },
          ...chatHistory
        ],
        temperature: 0.7,
        stream: false
      })
    });

    const data = await response.json();
    let reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : (currentLang === 'en' ? "Heaven's secrets are elusive, please try again later." : "天机虚渺，请稍后再试。");

    chatHistory.push({ role: "assistant", content: reply });

  } catch (err) {

    document.getElementById(aiMsgId).innerText = fallbackReply;
    chatHistory.push({ role: "assistant", content: fallbackReply });
  }
  chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
