<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>多源全量空间大数据提取引擎</title>
<style>
:root{--bg:#090d13;--panel:#111722;--panel2:#171e2b;--line:#273244;--text:#edf2f7;--muted:#93a0b3;--gold:#d8b36a;--green:#72b08a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:720px;margin:auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 20px}
.brand{font-weight:800;letter-spacing:.08em;font-size:18px}.brand span{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 16px 45px #0005}
.field{background:#0c121b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:transparent;border:0;color:var(--text);font-size:16px;outline:0}
.actions{display:flex;gap:10px;margin-top:16px}
button{border:0;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:var(--gold);color:#15110a;flex:1}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);flex:1}
.section-title{font-weight:800;margin:15px 0 10px;font-size:15px;color:var(--gold);display:flex;align-items:center;gap:8px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.result-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;word-break:break-all}
.result-item b{font-size:14px;color:var(--text);word-break:break-all}
.full-span{grid-column:1 / -1}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand" data-i18n="brand">多源全量空间提取 <span>·</span> Advanced GIS Engine</div>
    <!-- 默认语言为中文，初始化显示中国国旗 -->
    <button id="langBtn" class="secondary" style="width:38px;height:38px;border-radius:50%;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;" onclick="toggleLang()" title="Switch Language">🇨🇳</button>
  </header>

  <div class="card">
    <div class="field">
      <label data-i18n="lbl_lat">纬度</label>
      <input id="latInput" type="number" step="any" placeholder="例如: 3.1390">
    </div>
    <div class="field">
      <label data-i18n="lbl_lon">经度</label>
      <input id="lonInput" type="number" step="any" placeholder="例如: 101.6869">
    </div>
    <div class="actions">
      <button class="primary" onclick="extractAllData()" data-i18n="btn_query">深度提取全量空间与地形数据</button>
      <button class="secondary" onclick="fetchCurrentLocation()" data-i18n="btn_current">获取当前GPS定位</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="sec_primary">1. 核心地理位置信息</div>
    <div class="result-grid" id="primaryGrid">
      <div class="result-item full-span"><small data-i18n="lbl_status">状态</small><b data-i18n="status_ready">等待输入坐标</b></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="sec_extended">2. 扩展地形与周边实体数据</div>
    <div class="result-grid" id="extendedGrid">
      <div class="result-item full-span"><small data-i18n="lbl_status">状态</small><b data-i18n="status_waiting_ext">等待核心数据加载完成...</b></div>
    </div>
  </div>
</div>

<script>
let currentLang = 'zh';
let lastAddress = {};
let lastExtratags = {};
let lastElevation = null;
let lastOverpass = null;

const i18n = {
  zh: {
    brand: "多源全量空间提取 <span>·</span> Advanced GIS Engine",
    lbl_lat: "纬度",
    lbl_lon: "经度",
    lbl_status: "状态",
    btn_query: "深度提取全量空间与地形数据",
    btn_current: "获取当前GPS定位",
    sec_primary: "1. 核心地理位置信息",
    sec_extended: "2. 扩展地形与周边实体数据",
    r_road: "道路",
    r_village: "乡/村",
    r_town: "镇",
    r_city: "市",
    r_state: "省",
    r_region: "州",
    r_country: "国",
    r_postcode: "邮编",
    r_elevation: "海拔高度",
    r_precision: "坐标精度来源",
    r_quarter: "行政区/居民点",
    r_hamlet: "小村/集落",
    r_country_code: "国家代码",
    r_lanes: "车道数",
    r_oneway: "单行道",
    r_surface: "路面材质",
    r_smoothness: "路面平整度",
    r_cycleway: "自行车道",
    r_infra: "周边基础设施",
    unit_meters: "米",
    precision_val: "Open-Meteo 高程模型 / GPS 传感器",
    no_infra: "半径100米内无特定基础设施",
    status_ready: "等待输入坐标",
    status_loading_primary: "正在快速加载核心地理位置...",
    status_loading_extended: "正在后台加载地形与周边实体...",
    status_waiting_ext: "等待核心数据加载完成...",
    err_geo: "浏览器不支持定位或权限拒绝",
    err_fetch: "获取多源空间数据失败，请重试"
  },
  en: {
    brand: "Advanced GIS Engine <span>·</span> Multi-Source Extractor",
    lbl_lat: "Latitude",
    lbl_lon: "Longitude",
    lbl_status: "Status",
    btn_query: "Extract Spatial & Terrain Data",
    btn_current: "Get Current GPS",
    sec_primary: "1. Core Location Details",
    sec_extended: "2. Extended Terrain & Infrastructure Data",
    r_road: "Road",
    r_village: "Town/Village",
    r_town: "Town",
    r_city: "City",
    r_state: "Province/State",
    r_region: "Region/State",
    r_country: "Country",
    r_postcode: "Postcode",
    r_elevation: "Elevation",
    r_precision: "Coordinate Precision Source",
    r_quarter: "Quarter",
    r_hamlet: "Hamlet",
    r_country_code: "Country Code",
    r_lanes: "Lanes",
    r_oneway: "Oneway",
    r_surface: "Surface",
    r_smoothness: "Smoothness",
    r_cycleway: "Cycleway",
    r_infra: "Nearby Infrastructure",
    unit_meters: "meters",
    precision_val: "Open-Meteo DEM / GPS Sensor",
    no_infra: "None within 100m radius",
    status_ready: "Waiting for coordinates",
    status_loading_primary: "Quickly loading core location details...",
    status_loading_extended: "Loading elevation & infrastructure in background...",
    status_waiting_ext: "Waiting for core data...",
    err_geo: "Geolocation not supported or denied",
    err_fetch: "Failed to fetch multi-source data, please retry"
  }
};

const osmValueMap = {
  zh: {
    yes: "是",
    no: "否",
    "-1": "反向单行",
    asphalt: "沥青",
    paved: "已铺装",
    unpaved: "未铺装",
    gravel: "碎石",
    dirt: "土路",
    earth: "泥土",
    concrete: "混凝土",
    sand: "沙地",
    compacted: "压实路面",
    excellent: "极佳",
    good: "良好",
    intermediate: "一般",
    bad: "较差",
    horrible: "极差",
    very_horrible: "非常差",
    impassable: "无法通行",
    lane: "车道混合",
    track: "专用道",
    shared_lane: "共享车道",
    opposite: "逆行车道",
    none: "无"
  },
  en: {
    yes: "Yes",
    no: "No",
    "-1": "Reverse",
    asphalt: "Asphalt",
    paved: "Paved",
    unpaved: "Unpaved",
    gravel: "Gravel",
    dirt: "Dirt",
    earth: "Earth",
    concrete: "Concrete",
    sand: "Sand",
    compacted: "Compacted",
    excellent: "Excellent",
    good: "Good",
    intermediate: "Intermediate",
    bad: "Bad",
    horrible: "Horrible",
    very_horrible: "Very Horrible",
    impassable: "Impassable",
    lane: "Lane",
    track: "Track",
    shared_lane: "Shared Lane",
    opposite: "Opposite",
    none: "None"
  }
};

function translateOSMValue(val) {
  if (!val || val === '-') return '-';
  const lower = String(val).toLowerCase();
  const map = osmValueMap[currentLang];
  return map[lower] || val;
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  
  // 根据当前语言实时切换国旗：中文显示中国国旗，英文显示英国国旗
  document.getElementById('langBtn').innerText = currentLang === 'zh' ? '🇨🇳' : '🇬🇧';
  
  updateText();
  
  const lat = document.getElementById('latInput').value;
  const lon = document.getElementById('lonInput').value;
  if (lat && lon) {
    extractAllData();
  } else if (Object.keys(lastAddress).length > 0) {
    renderResults();
  }
}

function updateText() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
  });
}

function fetchCurrentLocation() {
  if (!navigator.geolocation) {
    alert(i18n[currentLang].err_geo);
    return;
  }
  
  document.getElementById('primaryGrid').innerHTML = `<div class="result-item full-span"><small>${i18n[currentLang].lbl_status}</small><b>${i18n[currentLang].status_loading_primary}</b></div>`;

  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('latInput').value = pos.coords.latitude.toFixed(6);
      document.getElementById('lonInput').value = pos.coords.longitude.toFixed(6);
      extractAllData();
    },
    err => {
      alert(i18n[currentLang].err_geo + ": " + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

async function extractAllData() {
  const lat = document.getElementById('latInput').value;
  const lon = document.getElementById('lonInput').value;
  
  if (!lat || !lon) {
    alert(currentLang === 'zh' ? '请输入或获取有效的经纬度' : 'Please input valid latitude and longitude');
    return;
  }

  const primaryGrid = document.getElementById('primaryGrid');
  const extendedGrid = document.getElementById('extendedGrid');

  primaryGrid.innerHTML = `<div class="result-item full-span"><small>${i18n[currentLang].lbl_status}</small><b>${i18n[currentLang].status_loading_primary}</b></div>`;
  extendedGrid.innerHTML = `<div class="result-item full-span"><small>${i18n[currentLang].lbl_status}</small><b>${i18n[currentLang].status_loading_extended}</b></div>`;

  try {
    const apiLang = currentLang === 'en' ? 'en' : 'zh-CN';

    const nominatimUrl = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&extratags=1&accept-language=${apiLang}`;
    const nomRes = await fetch(nominatimUrl).then(r => r.json());
    lastAddress = nomRes.address || {};
    lastExtratags = nomRes.extratags || {};

    renderCoreResults();

    const elevationUrl = `https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;
    const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json];node(around:100,${lat},${lon});out body;`;

    const [eleRes, overRes] = await Promise.allSettled([
      fetch(elevationUrl).then(r => r.json()),
      fetch(overpassUrl).then(r => r.json())
    ]);

    lastElevation = eleRes.status === 'fulfilled' ? eleRes.value : {};
    lastOverpass = overRes.status === 'fulfilled' ? overRes.value : {};

    renderExtendedResults();

  } catch (e) {
    alert(i18n[currentLang].err_fetch);
    console.error(e);
  }
}

function renderCoreResults() {
  const address = lastAddress;
  const road = address.road || address.pedestrian || address.footway || '-';
  const village = address.village || address.hamlet || address.suburb || '-';
  const town = address.town || address.municipality || '-';
  const city = address.city || address.town || address.county || '-';
  const state = address.state || address.province || '-';
  const region = address.region || address.state_district || '-';
  const country = address.country || '-';
  const postcode = address.postcode || '-';

  const primaryGrid = document.getElementById('primaryGrid');
  primaryGrid.innerHTML = `
    <div class="result-item"><small>${i18n[currentLang].r_road}</small><b>${road}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_village}</small><b>${village}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_town}</small><b>${town}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_city}</small><b>${city}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_state}</small><b>${state}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_region}</small><b>${region}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_country}</small><b>${country}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_postcode}</small><b>${postcode}</b></div>
  `;
}

function renderExtendedResults() {
  const extendedGrid = document.getElementById('extendedGrid');
  const elevationVal = lastElevation && lastElevation.elevation !== undefined ? `${lastElevation.elevation} ${i18n[currentLang].unit_meters}` : 'N/A';
  
  const precisionSource = i18n[currentLang].precision_val;
  const quarter = lastAddress.quarter || '-';
  const hamlet = lastAddress.hamlet || '-';
  const countryCode = lastAddress.country_code ? lastAddress.country_code.toUpperCase() : '-';
  
  const lanes = lastExtratags.lanes || '-';
  const oneway = translateOSMValue(lastExtratags.oneway);
  const surface = translateOSMValue(lastExtratags.surface);
  const smoothness = translateOSMValue(lastExtratags.smoothness);
  const cycleway = translateOSMValue(lastExtratags.cycleway);

  let extendedHtml = `
    <div class="result-item"><small>${i18n[currentLang].r_elevation}</small><b>${elevationVal}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_precision}</small><b>${precisionSource}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_quarter}</small><b>${quarter}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_hamlet}</small><b>${hamlet}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_country_code}</small><b>${countryCode}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_lanes}</small><b>${lanes}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_oneway}</small><b>${oneway}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_surface}</small><b>${surface}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_smoothness}</small><b>${smoothness}</b></div>
    <div class="result-item"><small>${i18n[currentLang].r_cycleway}</small><b>${cycleway}</b></div>
  `;

  const elements = lastOverpass && lastOverpass.elements ? lastOverpass.elements : [];
  if (elements.length > 0) {
    elements.slice(0, 4).forEach((el, idx) => {
      const tags = el.tags || {};
      const name = tags.name || tags.amenity || tags.building || tags.highway || `Node #${el.id}`;
      extendedHtml += `
        <div class="result-item">
          <small>${i18n[currentLang].r_infra} #${idx+1}</small>
          <b>${name}</b>
        </div>
      `;
    });
  } else {
    extendedHtml += `<div class="result-item full-span"><small>${i18n[currentLang].r_infra}</small><b>${i18n[currentLang].no_infra}</b></div>`;
  }

  extendedGrid.innerHTML = extendedHtml;
}

function renderResults() {
  if (Object.keys(lastAddress).length > 0) {
    renderCoreResults();
  }
  if (lastElevation || lastOverpass) {
    renderExtendedResults();
  }
}
</script>
</body>
</html>
