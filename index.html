<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>经纬度地理位置查询</title>
<style>
:root{--bg:#090d13;--panel:#111722;--panel2:#171e2b;--line:#273244;--text:#edf2f7;--muted:#93a0b3;--gold:#d8b36a;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:600px;margin:auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 20px}
.brand{font-weight:800;letter-spacing:.08em;font-size:18px}.brand span{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 16px 45px #0005}
.field{background:#0c121b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:transparent;border:0;color:var(--text);font-size:16px;outline:0}
.actions{display:flex;gap:10px;margin-top:16px}
button{border:0;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:var(--gold);color:#15110a;flex:1}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);flex:1}
.title{font-weight:800;margin-bottom:14px;font-size:16px;color:var(--gold)}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.result-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
.result-item b{font-size:15px;color:var(--text);word-break:break-all}
.full-span{grid-column:span 2}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand" data-i18n="brand">经纬度地理位置查询 <span>·</span> Location Finder</div>
    <button id="langBtn" class="secondary" style="width:38px;height:38px;border-radius:50%;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;" onclick="toggleLang()" title="Switch Language">🇬🇧</button>
  </header>

  <div class="card">
    <div class="field">
      <label data-i18n="lbl_lat">纬度 (Latitude)</label>
      <input id="latInput" type="number" step="any" placeholder="例如: 3.1390">
    </div>
    <div class="field">
      <label data-i18n="lbl_lon">经度 (Longitude)</label>
      <input id="lonInput" type="number" step="any" placeholder="例如: 101.6869">
    </div>
    <div class="actions">
      <button class="primary" onclick="queryLocation()" data-i18n="btn_query">查询经纬度位置</button>
      <button class="secondary" onclick="fetchCurrentLocation()" data-i18n="btn_current">获取当前GPS位置</button>
    </div>
  </div>

  <div class="card">
    <div class="title" data-i18n="res_title">详细地理位置信息</div>
    <div class="result-grid">
      <div class="result-item"><small data-i18n="r_country">国家 (Country)</small><b id="resCountry">-</b></div>
      <div class="result-item"><small data-i18n="r_province">省 / 州 (Province/State)</small><b id="resState">-</b></div>
      <div class="result-item"><small data-i18n="r_city">市 (City)</small><b id="resCity">-</b></div>
      <div class="result-item"><small data-i18n="r_district">地区 (District)</small><b id="resDistrict">-</b></div>
      <div class="result-item full-span"><small data-i18n="r_local">乡下 / 镇 / 村 / 当地名 (Town/Village/Local)</small><b id="resLocal">-</b></div>
    </div>
  </div>
</div>

<script>
let currentLang = 'zh';

const i18n = {
  zh: {
    brand: "经纬度地理位置查询 <span>·</span> Location Finder",
    lbl_lat: "纬度 (Latitude)",
    lbl_lon: "经度 (Longitude)",
    btn_query: "查询经纬度位置",
    btn_current: "获取当前GPS位置",
    res_title: "详细地理位置信息",
    r_country: "国家",
    r_province: "省 / 州",
    r_city: "市",
    r_district: "地区 / 县",
    r_local: "乡下 / 镇 / 村 / 当地名",
    err_geo: "浏览器不支持地理定位或定位权限被拒绝",
    err_fetch: "获取地址信息失败，请检查经纬度数值",
    locating: "正在定位中...",
    querying: "正在查询..."
  },
  en: {
    brand: "Location Finder <span>·</span> Lat/Lon Lookup",
    lbl_lat: "Latitude",
    lbl_lon: "Longitude",
    btn_query: "Query Location",
    btn_current: "Get Current GPS",
    res_title: "Detailed Location Info",
    r_country: "Country",
    r_province: "Province/State",
    r_city: "City",
    r_district: "District",
    r_local: "Town/Village/Local Name",
    err_geo: "Geolocation not supported or permission denied",
    err_fetch: "Failed to fetch address details, please check coordinates",
    locating: "Locating...",
    querying: "Querying..."
  }
};

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  document.getElementById('langBtn').innerText = currentLang === 'zh' ? '🇬🇧' : '🇨🇳';
  updateText();
}

function updateText() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
  });
}

function fetchCurrentLocation() {
  if (!navigator.geolocation) {
    alert(i18n[currentLang].err_geo);
    return;
  }
  
  document.getElementById('resCountry').innerText = i18n[currentLang].locating;
  document.getElementById('resState').innerText = "...";
  document.getElementById('resCity').innerText = "...";
  document.getElementById('resDistrict').innerText = "...";
  document.getElementById('resLocal').innerText = "...";

  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('latInput').value = pos.coords.latitude.toFixed(6);
      document.getElementById('lonInput').value = pos.coords.longitude.toFixed(6);
      queryLocation();
    },
    err => {
      alert(i18n[currentLang].err_geo + ": " + err.message);
      clearResults();
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

async function queryLocation() {
  const lat = document.getElementById('latInput').value;
  const lon = document.getElementById('lonInput').value;
  
  if (!lat || !lon) {
    alert(currentLang === 'zh' ? '请输入或获取有效的经纬度' : 'Please input or fetch valid latitude and longitude');
    return;
  }

  document.getElementById('resCountry').innerText = i18n[currentLang].querying;
  document.getElementById('resState').innerText = "...";
  document.getElementById('resCity').innerText = "...";
  document.getElementById('resDistrict').innerText = "...";
  document.getElementById('resLocal').innerText = "...";

  try {
    const apiLang = currentLang === 'en' ? 'en' : 'zh-CN';
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=${apiLang}`);
    const data = await res.json();
    const addr = data.address || {};

    document.getElementById('resCountry').innerText = addr.country || '-';
    document.getElementById('resState').innerText = addr.state || addr.province || addr.region || '-';
    document.getElementById('resCity').innerText = addr.city || addr.town || addr.municipality || '-';
    document.getElementById('resDistrict').innerText = addr.county || addr.city_district || addr.suburb || '-';
    document.getElementById('resLocal').innerText = addr.village || addr.hamlet || addr.neighbourhood || addr.locality || addr.suburb || '-';
  } catch (e) {
    alert(i18n[currentLang].err_fetch);
    clearResults();
  }
}

function clearResults() {
  document.getElementById('resCountry').innerText = '-';
  document.getElementById('resState').innerText = '-';
  document.getElementById('resCity').innerText = '-';
  document.getElementById('resDistrict').innerText = '-';
  document.getElementById('resLocal').innerText = '-';
}
</script>
</body>
</html>
